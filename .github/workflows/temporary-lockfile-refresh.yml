name: One-time Next.js lockfile refresh
on:
  push:
    branches: ["issue-48-nextjs-critical-security-patch"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-48-nextjs-critical-security-patch
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile using npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Package lock already synchronized."
          else
            git commit -m "chore: regenerate lockfile for patched Next.js 16.4.2"
            git push origin HEAD:issue-48-nextjs-critical-security-patch
          fi
