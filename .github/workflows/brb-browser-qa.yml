name: BR-B Chromium browser QA
on:
  push:
    branches: ["main", "issue-48-nextjs-critical-security-patch"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Static build
        run: npm run build
      - name: Install disposable browser test dependency
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static HTML and test responsive layout and UI
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory out > /tmp/trace-qa-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ech-beacon-explorer.html -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/check-brb-browser.mjs
